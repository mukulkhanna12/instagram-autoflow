name: CI

# Runs on every push and PR so a broken build is caught before it deploys.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Placeholder env so build-time code that reads process.env doesn't choke.
    # No real secrets — the app reads live values at request time on the host.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      NEXTAUTH_SECRET: ci-placeholder-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
